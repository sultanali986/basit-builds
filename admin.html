<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Basit Builds Admin Panel</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; margin: 0; padding: 20px; }
        .box { max-width: 850px; margin: auto; background: #1e293b; padding: 30px; border-radius: 10px; border: 1px solid #334155; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        h2, h3 { color: #38bdf8; text-align: center; }
        .group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 6px; font-weight: bold; color: #cbd5e1; font-size: 14px; }
        input, textarea { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        input:focus, textarea:focus { border-color: #38bdf8; outline: none; }
        button { background: #38bdf8; color: #0f172a; padding: 12px; border: none; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; font-size: 16px; transition: 0.2s; }
        button:hover { opacity: 0.9; }
        .danger { background: #ef4444; color: #fff; }
        .danger:hover { background: #dc2626; }
        .card-item { background: #0f172a; padding: 15px; margin-top: 10px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid #38bdf8; }
        #login-panel, #dashboard-panel { display: none; }
    </style>
</head>
<body>

    <div class="box">
        <!-- Login Form -->
        <div id="login-panel">
            <h2>Welcome to Basit Builds Admin Panel</h2>
            <div class="group">
                <label>Admin Email</label>
                <input type="email" id="l-email" placeholder="admin@email.com">
            </div>
            <div class="group">
                <label>Password</label>
                <input type="password" id="l-pass" placeholder="Password">
            </div>
            <button onclick="adminLogin()">Login to Dashboard</button>
        </div>

        <!-- Dashboard Panel -->
        <div id="dashboard-panel">
            <h2>Welcome to Basit Builds Admin Panel</h2>
            <p style="text-align: center; color: #94a3b8; font-size: 13px;">Master SMM & WordPress Style Control Center</p>
            
            <hr style="border-color: #334155; margin: 25px 0;">
            
            <!-- 1. Website Branding, SEO & Chat Settings -->
            <h3>1. Website Branding, SEO & Live Chat Settings</h3>
            <div class="group">
                <label>Website Logo URL (Image Link)</label>
                <input type="text" id="cfg-logo" placeholder="https://example.com/logo.png">
            </div>
            <div class="group">
                <label>Google SEO Title (For Top Google Ranking)</label>
                <input type="text" id="cfg-seotitle" placeholder="Basit Builds - Free Courses & Digital Services">
            </div>
            <div class="group">
                <label>Google SEO Meta Description (Search Snippet)</label>
                <textarea id="cfg-seodesc" rows="2" placeholder="Explore top digital courses..."></textarea>
            </div>
            <div class="group">
                <label>WhatsApp Support Number (e.g. 923001234567)</label>
                <input type="text" id="cfg-whatsapp" placeholder="923001234567">
            </div>
            <div class="group">
                <label>Live Chat / Messenger Script Code (HTML/JS)</label>
                <textarea id="cfg-livechat" rows="3" placeholder="Paste your Tawk.to, Messenger, or Live Chat script here..."></textarea>
            </div>
            <button onclick="saveGlobalSettings()">Save All Settings</button>

            <hr style="border-color: #334155; margin: 25px 0;">

            <!-- 2. Add New Course / Service -->
            <h3>2. Add New Course / Service</h3>
            <div class="group">
                <label>Course / Service Title</label>
                <input type="text" id="c-title" placeholder="Enter course title">
            </div>
            <div class="group">
                <label>Category</label>
                <input type="text" id="c-cat" placeholder="e.g. Free Courses">
            </div>
            <div class="group">
                <label>Price</label>
                <input type="text" id="c-price" placeholder="Free or Rs. 500">
            </div>
            <div class="group">
                <label>Thumbnail / Image URL</label>
                <input type="text" id="c-img" placeholder="Paste image link">
            </div>
            <div class="group">
                <label>Description</label>
                <textarea id="c-desc" rows="2" placeholder="Course details..."></textarea>
            </div>
            <div class="group">
                <label>Redirect / Download / WhatsApp Link</label>
                <input type="text" id="c-link" placeholder="Enter link">
            </div>
            <button onclick="addNewCourse()">Publish Course / Item</button>

            <hr style="border-color: #334155; margin: 25px 0;">

            <!-- 3. Manage & Delete Existing Courses -->
            <h3>3. Manage & Delete Existing Courses</h3>
            <div id="manage-list"><p style="color: #94a3b8;">Loading courses...</p></div>

            <button class="danger" style="margin-top: 35px;" onclick="adminLogout()">Logout</button>
        </div>
    </div>

    <!-- Firebase SDK Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyBCkU6QvkUWWuQckXsifIKqz54w2r3ngUU",
          authDomain: "basit-builds.firebaseapp.com",
          projectId: "basit-builds",
          storageBucket: "basit-builds.firebasestorage.app",
          messagingSenderId: "1067815599250",
          appId: "1:1067815599250:web:ddbf5c0bf831cd59253a4b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Check Login Status
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('dashboard-panel').style.display = 'block';
                document.getElementById('login-panel').style.display = 'none';
                loadAdminData();
            } else {
                document.getElementById('login-panel').style.display = 'block';
                document.getElementById('dashboard-panel').style.display = 'none';
            }
        });

        window.adminLogin = function() {
            const email = document.getElementById('l-email').value;
            const pass = document.getElementById('l-pass').value;
            signInWithEmailAndPassword(auth, email, pass).catch(e => alert("Login Error: " + e.message));
        };

        window.adminLogout = function() { signOut(auth); };

        // Save Global Settings (Logo, SEO, WhatsApp, Live Chat)
        window.saveGlobalSettings = async function() {
            const logo = document.getElementById('cfg-logo').value;
            const seotitle = document.getElementById('cfg-seotitle').value;
            const seodesc = document.getElementById('cfg-seodesc').value;
            const whatsapp = document.getElementById('cfg-whatsapp').value;
            const livechat = document.getElementById('cfg-livechat').value;
            
            try {
                await setDoc(doc(db, "settings", "global"), { logo, seotitle, seodesc, whatsapp, livechat }, { merge: true });
                alert("Settings saved successfully in Firebase database!");
            } catch (e) {
                alert("Error saving: " + e.message);
            }
        };

        // Add Course Function
        window.addNewCourse = async function() {
            const title = document.getElementById('c-title').value;
            const category = document.getElementById('c-cat').value;
            const price = document.getElementById('c-price').value;
            const img = document.getElementById('c-img').value;
            const desc = document.getElementById('c-desc').value;
            const link = document.getElementById('c-link').value;

            if(!title || !link) { alert("Please fill Title and Link fields!"); return; }

            try {
                await addDoc(collection(db, "courses"), { title, category, price, img, desc, link, createdAt: new Date() });
                alert("Course published successfully!");
                document.getElementById('c-title').value = '';
                document.getElementById('c-cat').value = '';
                document.getElementById('c-price').value = '';
                document.getElementById('c-img').value = '';
                document.getElementById('c-desc').value = '';
                document.getElementById('c-link').value = '';
                loadCoursesList();
            } catch (e) {
                alert("Error: " + e.message);
            }
        };

        // Load Courses for Management
        async function loadCoursesList() {
            const container = document.getElementById('manage-list');
            try {
                const snap = await getDocs(collection(db, "courses"));
                container.innerHTML = "";
                if(snap.empty) { container.innerHTML = "<p style='color: #94a3b8;'>No courses found.</p>"; return; }
                
                snap.forEach((d) => {
                    const data = d.data();
                    const div = document.createElement('div');
                    div.className = 'card-item';
                    div.innerHTML = `
                        <span><strong>${data.title}</strong> (${data.price || 'Free'})</span>
                        <button class="danger" style="width: auto; padding: 6px 12px; font-size: 13px; margin:0;" onclick="removeCourse('${d.id}')">Delete</button>
                    `;
                    container.appendChild(div);
                });
            } catch (e) {
                container.innerHTML = "<p style='color: #ef4444;'>Error loading courses.</p>";
            }
        }

        // Delete Course
        window.removeCourse = async function(id) {
            if(confirm("Are you sure you want to delete this course?")) {
                try {
                    await deleteDoc(doc(db, "courses", id));
                    alert("Course deleted successfully!");
                    loadCoursesList();
                } catch (e) {
                    alert("Error deleting: " + e.message);
                }
            }
        };

        // Load Existing Settings into Admin Panel
        async function loadAdminData() {
            loadCoursesList();
            try {
                const docSnap = await getDoc(doc(db, "settings", "global"));
                if(docSnap.exists()) {
                    const data = docSnap.data();
                    document.getElementById('cfg-logo').value = data.logo || '';
                    document.getElementById('cfg-seotitle').value = data.seotitle || '';
                    document.getElementById('cfg-seodesc').value = data.seodesc || '';
                    document.getElementById('cfg-whatsapp').value = data.whatsapp || '';
                    document.getElementById('cfg-livechat').value = data.livechat || '';
                }
            } catch (e) {
                console.log(e);
            }
        }
    </script>
</body>
</html>
