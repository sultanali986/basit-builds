<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basit Builds - Professional SMM & Master Admin Panel</title>
    <style>
        :root {
            --bg-dark: #090d16;
            --panel-bg: #111827;
            --border-clr: #1f2937;
            --accent: #38bdf8;
            --text-light: #f3f4f6;
            --text-gray: #9ca3af;
            --danger: #ef4444;
            --success: #22c55e;
        }
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg-dark); color: var(--text-light); margin: 0; padding: 0; height: 100vh; overflow: hidden; }

        /* Login Screen Styles */
        #login-screen { display: flex; justify-content: center; align-items: center; height: 100vh; background: var(--bg-dark); }
        .login-box { background: var(--panel-bg); padding: 40px; border-radius: 12px; border: 1px solid var(--border-clr); width: 100%; max-width: 400px; box-shadow: 0 15px 35px rgba(0,0,0,0.7); text-align: center; }
        .login-box h2 { color: var(--accent); margin-bottom: 25px; }

        /* Split Screen Dashboard */
        #dashboard-screen { display: none; height: 100vh; display: none; grid-template-columns: 450px 1fr; }
        @media(max-width: 1024px) { #dashboard-screen { grid-template-columns: 1fr; } .preview-pane { display: none; } }

        /* Left Control Panel */
        .control-pane { background: var(--panel-bg); border-right: 1px solid var(--border-clr); display: flex; flex-direction: column; height: 100vh; overflow-y: auto; padding: 20px; }
        .control-pane h2 { color: var(--accent); font-size: 18px; margin-top: 0; text-align: center; border-bottom: 1px solid var(--border-clr); padding-bottom: 12px; }
        
        .section-box { background: #030712; border: 1px solid var(--border-clr); border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        .section-box h3 { color: var(--accent); font-size: 14px; margin-top: 0; margin-bottom: 12px; border-bottom: 1px dashed var(--border-clr); padding-bottom: 6px; }

        label { display: block; font-size: 12px; font-weight: 600; color: var(--text-gray); margin-bottom: 4px; }
        input, textarea, select { width: 100%; padding: 8px 10px; background: #111827; border: 1px solid var(--border-clr); color: var(--text-light); border-radius: 6px; font-size: 13px; margin-bottom: 10px; }
        input:focus, textarea:focus { border-color: var(--accent); outline: none; }

        .btn { background: var(--accent); color: #090d16; border: none; padding: 9px 15px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; font-size: 13px; transition: 0.2s; }
        .btn:hover { opacity: 0.9; }
        .btn-danger { background: var(--danger); color: #fff; }
        
        /* Right Live Preview Pane */
        .preview-pane { background: #030712; display: flex; flex-direction: column; height: 100vh; }
        .preview-header { background: #111827; padding: 12px 20px; border-bottom: 1px solid var(--border-clr); display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--text-gray); }
        .preview-header span { color: var(--success); font-weight: bold; display: flex; align-items: center; gap: 6px; }
        .preview-header span::before { content: ''; width: 8px; height: 8px; background: var(--success); border-radius: 50%; display: inline-block; }
        .preview-body { flex: 1; border: none; width: 100%; height: 100%; background: #0f172a; }

        /* SMM Services Table Item */
        .smm-item { background: #111827; padding: 10px; border-radius: 6px; margin-bottom: 8px; border-left: 3px solid var(--accent); display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
        .smm-info b { display: block; color: var(--text-light); }
        .smm-info span { color: var(--text-gray); font-size: 11px; }
    </style>
</head>
<body>

    <!-- 1. LOGIN SCREEN -->
    <div id="login-screen">
        <div class="login-box">
            <h2>Basit Builds Admin</h2>
            <div style="text-align: left;">
                <label>Admin Email</label>
                <input type="email" id="l-email" placeholder="admin@basitbuilds.com">
                <label>Password</label>
                <input type="password" id="l-pass" placeholder="••••••••">
            </div>
            <button class="btn" style="margin-top: 15px;" onclick="adminLogin()">Login to SMM Panel</button>
        </div>
    </div>

    <!-- 2. SPLIT SCREEN DASHBOARD -->
    <div id="dashboard-screen">
        
        <!-- Left Pane: Professional Controls -->
        <div class="control-pane">
            <h2>Basit Builds Master SMM Control</h2>

            <!-- Global Website Settings -->
            <div class="section-box">
                <h3>1. Branding & Live SEO Tags</h3>
                <label>Website Logo URL</label>
                <input type="text" id="cfg-logo" placeholder="https://...">
                <label>Google SEO Title</label>
                <input type="text" id="cfg-seotitle" placeholder="Basit Builds - Digital Services">
                <label>Google SEO Meta Description</label>
                <textarea id="cfg-seodesc" rows="2" placeholder="Description..."></textarea>
                <label>WhatsApp Number</label>
                <input type="text" id="cfg-whatsapp" placeholder="923001234567">
                <button class="btn" onclick="saveGlobalSettings()">Save Settings & Update Live</button>
            </div>

            <!-- SMM / Services Manager -->
            <div class="section-box">
                <h3>2. Add New Service / Course</h3>
                <label>Service / Course Title</label>
                <input type="text" id="c-title" placeholder="e.g. TikTok Views / Python Course">
                <label>Category</label>
                <input type="text" id="c-cat" placeholder="e.g. SMM Panel / Free Courses">
                <label>Price / Rate</label>
                <input type="text" id="c-price" placeholder="Free or Rs. 500">
                <label>Thumbnail / Image URL</label>
                <input type="text" id="c-img" placeholder="Image link">
                <label>Description</label>
                <textarea id="c-desc" rows="2" placeholder="Details..."></textarea>
                <label>Redirect Link</label>
                <input type="text" id="c-link" placeholder="Target Link">
                <button class="btn" onclick="addNewService()">Publish Service / Course</button>
            </div>

            <!-- Existing Services List (SMM Style) -->
            <div class="section-box">
                <h3>3. Manage Existing Services & Courses</h3>
                <div id="services-list"><p style="color:var(--text-gray); font-size:12px;">Loading items...</p></div>
            </div>

            <button class="btn btn-danger" style="margin-top: auto;" onclick="adminLogout()">Logout</button>
        </div>

        <!-- Right Pane: Live Website Preview -->
        <div class="preview-pane">
            <div class="preview-header">
                <strong>Live Website Preview (Basit Builds)</strong>
                <span>Live Sync Active</span>
            </div>
            <!-- Here index.html will be loaded dynamically for live view -->
            <iframe id="live-preview-frame" class="preview-body" src="../index.html"></iframe>
        </div>

    </div>

    <!-- Firebase Script SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyBCkU6QvkUWWuQckXsifIKqz54w2r3ngUU",
          authDomain: "basit-builds.firebaseapp.com",
          projectId: "basit-builds",
          storageBucket: "basit-builds.firebasestorage.app",
          messagingSenderId: "1067815599250",
          appId: "1:1067815599250:web:ddbf5c0bf831cd59253a4b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('dashboard-screen').style.display = 'grid';
                // Load live preview frame pointing to index.html
                document.getElementById('live-preview-frame').src = 'index.html';
                loadAdminData();
            } else {
                document.getElementById('login-screen').style.display = 'flex';
                document.getElementById('dashboard-screen').style.display = 'none';
            }
        });

        window.adminLogin = function() {
            const email = document.getElementById('l-email').value;
            const pass = document.getElementById('l-pass').value;
            signInWithEmailAndPassword(auth, email, pass).catch(e => alert("Login Error: " + e.message));
        };

        window.adminLogout = function() { signOut(auth); };

        window.saveGlobalSettings = async function() {
            const logo = document.getElementById('cfg-logo').value;
            const seotitle = document.getElementById('cfg-seotitle').value;
            const seodesc = document.getElementById('cfg-seodesc').value;
            const whatsapp = document.getElementById('cfg-whatsapp').value;
            
            await setDoc(doc(db, "settings", "global"), { logo, seotitle, seodesc, whatsapp }, { merge: true });
            alert("Settings saved successfully! Right side preview will reflect changes.");
            document.getElementById('live-preview-frame').contentWindow.location.reload();
        };

        window.addNewService = async function() {
            const title = document.getElementById('c-title').value;
            const category = document.getElementById('c-cat').value;
            const price = document.getElementById('c-price').value;
            const img = document.getElementById('c-img').value;
            const desc = document.getElementById('c-desc').value;
            const link = document.getElementById('c-link').value;

            if(!title || !link) return alert("Title and Link are required!");

            await addDoc(collection(db, "courses"), { title, category, price, img, desc, link });
            alert("Service / Course published!");
            document.getElementById('c-title').value = '';
            document.getElementById('c-cat').value = '';
            document.getElementById('c-price').value = '';
            document.getElementById('c-img').value = '';
            document.getElementById('c-desc').value = '';
            document.getElementById('c-link').value = '';
            loadServicesList();
            document.getElementById('live-preview-frame').contentWindow.location.reload();
        };

        async function loadServicesList() {
            const container = document.getElementById('services-list');
            const snap = await getDocs(collection(db, "courses"));
            container.innerHTML = "";
            if(snap.empty) { container.innerHTML = "<p style='color:var(--text-gray); font-size:12px;'>No services/courses found.</p>"; return; }

            snap.forEach((d) => {
                const data = d.data();
                container.innerHTML += `
                    <div class="smm-item">
                        <div class="smm-info">
                            <b>${data.title}</b>
                            <span>${data.category || 'General'} | <strong>${data.price || 'Free'}</strong></span>
                        </div>
                        <button class="btn btn-danger" style="width: auto; padding: 4px 8px; font-size: 11px;" onclick="deleteService('${d.id}')">Delete</button>
                    </div>
                `;
            });
        }

        window.deleteService = async function(id) {
            if(confirm("Delete this service/course?")) {
                await deleteDoc(doc(db, "courses", id));
                loadServicesList();
                document.getElementById('live-preview-frame').contentWindow.location.reload();
            }
        };

        async function loadAdminData() {
            loadServicesList();
            const snap = await getDoc(doc(db, "settings", "global"));
            if(snap.exists()) {
                const d = snap.data();
                document.getElementById('cfg-logo').value = d.logo || '';
                document.getElementById('cfg-seotitle').value = d.seotitle || '';
                document.getElementById('cfg-seodesc').value = d.seodesc || '';
                document.getElementById('cfg-whatsapp').value = d.whatsapp || '';
            }
        }
    </script>
</body>
</html>
